name: Build English Iraq App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          mkdir -p app
          unzip -q English_Iraq_PlayReady.zip -d app

      - name: Find Flutter project
        id: project
        run: |
          PUBSPEC=$(find app -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            find app -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project: $PROJECT_DIR"

      - name: Recreate Android platform
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -rf android
          flutter create --platforms=android --org com.englishiraq .

      - name: Set application ID
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          sed -i 's/applicationId = "[^"]*"/applicationId = "com.englishiraq.app"/' android/app/build.gradle.kts || true
          sed -i 's/applicationId "[^"]*"/applicationId "com.englishiraq.app"/' android/app/build.gradle || true
          sed -i 's/namespace = "[^"]*"/namespace = "com.englishiraq.app"/' android/app/build.gradle.kts || true
          sed -i 's/namespace "[^"]*"/namespace "com.englishiraq.app"/' android/app/build.gradle || true

      - name: Set Android API 36
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 36/' android/app/build.gradle || true

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter analyze

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Build Release AAB
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Iraq-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: English-Iraq-AAB
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/bundle/release/app-release.aab
