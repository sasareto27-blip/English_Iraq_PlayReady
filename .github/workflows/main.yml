name: Build English Iraq App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project ZIP
        run: |
          mkdir -p app
          unzip -q English_Iraq_PlayReady.zip -d app

          echo "Searching for Flutter project..."
          find app -name pubspec.yaml -print

      - name: Find Flutter project
        id: project
        run: |
          PUBSPEC=$(find app -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upgrade Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "Current Gradle wrapper:"
          cat android/gradle/wrapper/gradle-wrapper.properties

          sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.14.0-all.zip#g' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "Updated Gradle wrapper:"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Iraq-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
